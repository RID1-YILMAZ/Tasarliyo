<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d14">
<title>Tasarlıyo · Topluyo kart tasarım aracı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Tasarlıyo</h1><p>Topluyo sohbet kartlarını tasarla, <code>~{}</code> kodunu kopyala.</p></header>
<main>
<section><h2>Yapı</h2>
  <div class="bar"><select id="addType"></select><button id="bAdd">+ Ekle</button><button id="bRow">+ Satır</button><button id="bZebra">Zebra</button></div>
  <div id="tree"></div>
  <div class="bar"><button id="bUp">↑</button><button id="bDown">↓</button><button id="bDup">Çoğalt</button><button id="bDel" class="red">Sil</button></div>
</section>
<section><h2>Özellikler</h2><div id="props"></div></section>
<section><h2>Önizleme</h2><div id="pv"></div><p class="hint">Yaklaşık önizleme. Asıl görünüm Topluyo'da.</p></section>
<section><h2>Çıktı</h2>
  <textarea id="out" readonly rows="10"></textarea>
  <div class="bar"><button id="bCopy" class="pri">Kopyala</button><label class="chk"><input type="checkbox" id="min"> Sıkıştır</label><button id="bPre">Rol tablosu örneği</button></div>
  <h3>İçe aktar</h3>
  <textarea id="imp" rows="3" placeholder="~{...} yapıştır"></textarea>
  <div class="bar"><button id="bImp">Yükle</button><span id="err"></span></div>
</section>
</main>
<script src="registry.js"></script>
<script src="app.js"></script>
</body>
</html>
